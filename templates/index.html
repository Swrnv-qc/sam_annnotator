<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM 2 Auto-Annotator</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --toolbar-bg: #ffffff;
            --item-hover: #f8fafc;
            --item-active-bg: #eff6ff;
            --item-active-text: #2563eb;
            --hardware-panel-bg: #f1f5f9;
            --help-bg: #f8fafc;
            --help-kbd-bg: #e2e8f0;
            --sidebar-width: 260px;
        }

        .dark-theme {
            --bg: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --toolbar-bg: #1e293b;
            --item-hover: #334155;
            --item-active-bg: #2563eb;
            --item-active-text: #ffffff;
            --hardware-panel-bg: #0f172a;
            --help-bg: #1e293b;
            --help-kbd-bg: #334155;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        #root {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0f172a;
        }
        .toolbar {
            height: 60px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1rem;
            z-index: 10;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .image-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 2rem;
        }
        .canvas-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas, .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
        .img-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }
        .img-item:hover { background: var(--item-hover); }
        .img-item.active { 
            background: var(--item-active-bg); 
            border-left: 4px solid var(--primary); 
            color: var(--item-active-text); 
        }
        
        .hardware-panel {
            padding: 1rem;
            background: var(--hardware-panel-bg);
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .help-section {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding: 1rem;
        }
        .help-content {
            background: var(--help-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 0.75rem;
            line-height: 1.4;
            display: none;
            margin-top: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            color: var(--text-main);
        }
        .help-content.visible { display: block; }
        .help-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .help-kdb {
            background: var(--help-kbd-bg);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: monospace;
            font-weight: bold;
            color: var(--text-main);
        }
        button {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .controls {
            display: flex;
            gap: 0.5rem;
        }
        .point-pos { color: #22c55e; }
        .point-neg { color: #ef4444; }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .theme-toggle:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
