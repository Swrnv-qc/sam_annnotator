<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM 2 Auto-Annotator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --sidebar-width: 260px;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            overflow: hidden;
        }
        #root {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0f172a;
        }
        .toolbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1rem;
            z-index: 10;
        }
        .image-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 2rem;
        }
        .canvas-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas, .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
        .img-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .img-item:hover { background: #f8fafc; }
        .img-item.active { background: #eff6ff; border-left: 4px solid var(--primary); color: var(--primary); }
        
        .hardware-panel {
            padding: 1rem;
            background: #f1f5f9;
            font-size: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .help-section {
            margin-top: auto;
            border-top: 1px solid #e2e8f0;
            padding: 1rem;
        }
        .help-content {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 0.75rem;
            line-height: 1.4;
            display: none;
            margin-top: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .help-content.visible { display: block; }
        .help-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.875rem;
            color: #64748b;
        }
        .help-kdb {
            background: #e2e8f0;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: monospace;
            font-weight: bold;
        }
        button {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .controls {
            display: flex;
            gap: 0.5rem;
        }
        .point-pos { color: #22c55e; }
        .point-neg { color: #ef4444; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
